<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Estado do Pedido · Balcão Agrícola</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#faf7f2">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f3eee7;
      --surface: #ffffff;
      --surface-2: #faf7f2;
      --text: #271b14;
      --text-muted: #756255;
      --border: #e6dcd0;
      --accent: #b45309;
      --accent-dark: #78350f;
      --accent-soft: #fef3c7;
      --accent-border: #fcd34d;
      --success: #15803d;
      --danger: #dc2626;
      --r-sm: 14px;
      --r-md: 18px;
      --r-xl: 26px;
      --shadow: 0 20px 44px -14px rgba(39, 27, 20, 0.14);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; }
    body {
      min-height: 100dvh;
      background: linear-gradient(155deg, #ede5da 0%, #faf7f2 55%, #e8ddd0 100%);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }
    .card {
      width: 100%;
      max-width: 470px;
      background: var(--surface);
      border-radius: var(--r-xl);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      overflow: hidden;
    }
    .top-bar { height: 4px; background: linear-gradient(90deg, #78350f, #b45309, #d97706); }
    .head { padding: 20px 24px 16px; border-bottom: 1px solid var(--border); background: var(--surface-2); }
    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }
    .brand-logo {
      max-height: 36px;
      object-fit: contain;
      mix-blend-mode: multiply;
    }
    .tag {
      display: inline-block;
      padding: 5px 11px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .tag.aprovar { background: #dcfce7; color: #166534; }
    .tag.recusar { background: #fee2e2; color: #991b1b; }
    .tag.encerrado { background: #f1f5f9; color: #334155; }
    .head h1 { font-size: 1.18rem; font-weight: 800; color: var(--text); }
    .head p { font-size: 0.84rem; color: var(--text-muted); margin-top: 4px; }
    .body { padding: 22px 24px 26px; }
    .detalhes-box {
      background: var(--surface-2);
      border: 1.5px solid var(--border);
      border-radius: var(--r-md);
      padding: 14px 16px;
      margin-bottom: 18px;
      font-size: 0.88rem;
      line-height: 1.55;
    }
    .detalhes-row { margin-bottom: 7px; }
    .detalhes-row:last-child { margin-bottom: 0; }
    .detalhes-lbl { font-weight: 700; color: var(--text-muted); font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.05em; }
    .detalhes-val { font-weight: 700; color: var(--text); word-break: break-word; }
    .anexo-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
      padding: 9px 12px;
      background: var(--accent-soft);
      border: 1.5px solid var(--accent-border);
      border-radius: 10px;
      color: var(--accent-dark);
      font-size: 0.8rem;
      font-weight: 700;
      text-decoration: none;
      word-break: break-word;
    }
    .anexo-link:hover { filter: brightness(0.97); }
    label {
      display: block;
      font-size: 0.74rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    textarea {
      width: 100%;
      min-height: 112px;
      padding: 13px 15px;
      border: 1.5px solid var(--border);
      border-radius: var(--r-sm);
      background: var(--surface-2);
      color: var(--text);
      font-size: 0.95rem;
      font-weight: 500;
      resize: vertical;
      outline: none;
      margin-bottom: 16px;
    }
    textarea:focus { border-color: var(--accent); background: #fff; }
    .btn-submit {
      width: 100%;
      padding: 15px 18px;
      border: none;
      border-radius: var(--r-sm);
      font-size: 0.86rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #fff;
      cursor: pointer;
    }
    .btn-submit.aprovar { background: linear-gradient(135deg, #15803d, #16a34a); }
    .btn-submit.recusar { background: linear-gradient(135deg, #b91c1c, #dc2626); }
    .btn-submit:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn-retry {
      margin-top: 14px;
      padding: 11px 16px;
      border-radius: var(--r-sm);
      border: 1.5px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      font-size: 0.8rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      cursor: pointer;
    }
    .status-msg {
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: var(--r-sm);
      font-size: 0.88rem;
      font-weight: 700;
      display: none;
      text-align: center;
    }
    .status-msg.ok { display: block; background: #dcfce7; color: #166534; }
    .status-msg.err { display: block; background: #fee2e2; color: #991b1b; }
    .status-msg.wait { display: block; background: #fef3c7; color: #92400e; }
    .verificacao-box {
      text-align: center;
      padding: 22px 10px;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);
    }
    .concluido-box { text-align: center; padding: 12px 4px; }
    .concluido-ico { font-size: 2.4rem; margin-bottom: 12px; }
    .concluido-titulo { font-size: 1.08rem; font-weight: 800; color: var(--text); margin-bottom: 8px; }
    .concluido-desc { font-size: 0.9rem; color: var(--text-muted); line-height: 1.55; margin-bottom: 18px; }
    .resumo-final {
      text-align: left;
      background: var(--surface-2);
      border: 1.5px solid var(--border);
      border-radius: var(--r-md);
      padding: 14px 16px;
      font-size: 0.86rem;
      line-height: 1.6;
    }
    .foot {
      text-align: center;
      font-size: 0.68rem;
      font-weight: 700;
      color: #a39184;
      padding: 10px;
      border-top: 1px solid var(--border);
      background: var(--surface-2);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="top-bar"></div>
    <div class="head">
      <div class="brand-row">
        <img src="https://lh3.googleusercontent.com/d/1dgTBVH4Mv0nn4xwTRFC-5iRV5TJ2RQqG" onerror="this.src='./icon.svg'" class="brand-logo" alt="Balcão Agrícola">
        <div id="badgeAcao" class="tag encerrado">Pedido</div>
      </div>
      <h1 id="tituloPagina">A verificar pedido...</h1>
      <p id="subtituloPagina">A confirmar estado atual no servidor</p>
    </div>
    <div class="body">
      <div id="areaVerificacao" class="verificacao-box">
        <div id="textoVerificacao">A verificar estado do pedido...</div>
        <button type="button" id="btnReverificar" class="btn-retry" style="display:none;" onclick="verificarEstadoPedidoServidor()">🔄 Verificar novamente</button>
      </div>

      <div id="areaFormulario" style="display:none;">
        <div class="detalhes-box" id="caixaDetalhes">
          <div class="detalhes-row"><span class="detalhes-lbl">Colaborador:</span> <span class="detalhes-val" id="dNome">—</span></div>
          <div class="detalhes-row"><span class="detalhes-lbl">Motivo:</span> <span class="detalhes-val" id="dTipo">—</span></div>
          <div class="detalhes-row"><span class="detalhes-lbl">Período:</span> <span class="detalhes-val" id="dPeriodo">—</span></div>
          <div class="detalhes-row" id="rowObs" style="display:none;"><span class="detalhes-lbl">Observações:</span> <span class="detalhes-val" id="dObs" style="font-weight:500;">—</span></div>
          <div id="rowAnexo" style="display:none;"></div>
        </div>

        <label for="mensagemResposta">Mensagem de resposta (opcional)</label>
        <textarea id="mensagemResposta" placeholder="Escreva aqui a sua mensagem..."></textarea>

        <button type="button" id="btnEnviar" class="btn-submit aprovar" onclick="enviarRespostaPedido()">Enviar Resposta</button>
        <div id="estadoEnvio" class="status-msg"></div>
      </div>

      <div id="areaEncerrado" class="concluido-box" style="display:none;">
        <div id="icoEncerrado" class="concluido-ico">✅</div>
        <div id="tituloEncerrado" class="concluido-titulo">Pedido já respondido</div>
        <div id="descEncerrado" class="concluido-desc">Este pedido já foi processado anteriormente e não permite novas respostas.</div>
        <div id="resumoEncerrado" class="resumo-final"></div>
      </div>
    </div>
    <div class="foot">© <span id="footYear">2026</span> · Balcão Agrícola</div>
  </div>

  <script>
    var APP_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwO33X2VgI6XIZz60-HhvPCf6rV-h3fv7lGTZ5cg12qS9Z6Bp4tXU_QIsjbd2RhmVpBKA/exec";
    var qs = new URLSearchParams(window.location.search || '');
    var pedidoId = (qs.get('id') || '').trim();
    var pedidoSig = (qs.get('sig') || '').trim();
    var acao = ((qs.get('acao') || 'aprovar').trim().toLowerCase() === 'recusar') ? 'recusar' : 'aprovar';
    var infoPedido = {
      nome: qs.get('nome') || '—',
      tipo: qs.get('tipo') || '—',
      periodo: ((qs.get('ini') || qs.get('fim')) ? ((qs.get('ini') || '—') + ' → ' + (qs.get('fim') || '—')) : '—'),
      obs: '',
      anexoNome: '',
      anexoUrl: ''
    };

    var fy = document.getElementById('footYear');
    if (fy) fy.textContent = String(new Date().getFullYear());

    function limparCacheLocalAoAbrir() {
      try { if (window.sessionStorage) sessionStorage.clear(); } catch (eS) {}
      try {
        if (window.localStorage) {
          var keysToRemove = [];
          for (var i = 0; i < localStorage.length; i++) {
            var k = localStorage.key(i);
            if (!k) continue;
            if (k.indexOf('PED_RESP_KEY_') === 0 || (k.indexOf('PED_RESP_LOC_') === 0 && k !== ('PED_RESP_LOC_' + pedidoId))) {
              keysToRemove.push(k);
            }
          }
          for (var j = 0; j < keysToRemove.length; j++) {
            localStorage.removeItem(keysToRemove[j]);
          }
        }
      } catch (eL) {}
    }

    function guardarEstadoLocal(id, estado) {
      if (!id || !estado) return;
      try {
        localStorage.setItem('PED_RESP_LOC_' + id, JSON.stringify({ estado: estado, ts: Date.now() }));
      } catch (e) {}
    }

    function lerEstadoLocal(id) {
      if (!id) return '';
      try {
        var raw = localStorage.getItem('PED_RESP_LOC_' + id);
        if (raw) {
          var obj = JSON.parse(raw);
          if (obj && obj.estado) return String(obj.estado).trim();
        }
      } catch (e) {}
      return '';
    }

    function atualizarDetalhesVisiveis() {
      document.getElementById('dNome').textContent = infoPedido.nome;
      document.getElementById('dTipo').textContent = infoPedido.tipo;
      document.getElementById('dPeriodo').textContent = infoPedido.periodo;

      var rowObs = document.getElementById('rowObs');
      var dObs = document.getElementById('dObs');
      if (infoPedido.obs && infoPedido.obs !== '—') {
        dObs.textContent = infoPedido.obs;
        rowObs.style.display = 'block';
      } else {
        rowObs.style.display = 'none';
      }

      var rowAnexo = document.getElementById('rowAnexo');
      if (infoPedido.anexoUrl) {
        rowAnexo.innerHTML = '<a href="' + escaparHtml(infoPedido.anexoUrl) + '" target="_blank" rel="noopener" class="anexo-link">📎 ' + escaparHtml(infoPedido.anexoNome || 'Ver comprovativo anexo') + '</a>';
        rowAnexo.style.display = 'block';
      } else {
        rowAnexo.style.display = 'none';
        rowAnexo.innerHTML = '';
      }
    }

    function mostrarVerificacao(msg, mostrarBotao) {
      var verif = document.getElementById('areaVerificacao');
      var txt = document.getElementById('textoVerificacao');
      var btnRe = document.getElementById('btnReverificar');
      var formArea = document.getElementById('areaFormulario');
      var endArea = document.getElementById('areaEncerrado');
      if (formArea) formArea.style.display = 'none';
      if (endArea) endArea.style.display = 'none';
      if (verif) verif.style.display = 'block';
      if (txt) txt.textContent = msg || 'A verificar estado do pedido...';
      if (btnRe) btnRe.style.display = mostrarBotao ? 'inline-block' : 'none';
    }

    function mostrarAreaFormulario() {
      var badge = document.getElementById('badgeAcao');
      var h1 = document.getElementById('tituloPagina');
      var sub = document.getElementById('subtituloPagina');
      var btn = document.getElementById('btnEnviar');
      var verif = document.getElementById('areaVerificacao');
      var formArea = document.getElementById('areaFormulario');
      var endArea = document.getElementById('areaEncerrado');

      if (acao === 'recusar') {
        badge.className = 'tag recusar';
        badge.textContent = '❌ Recusar Pedido';
        btn.className = 'btn-submit recusar';
        btn.textContent = 'Enviar Recusa';
      } else {
        badge.className = 'tag aprovar';
        badge.textContent = '✅ Aprovar Pedido';
        btn.className = 'btn-submit aprovar';
        btn.textContent = 'Enviar Aprovação';
      }
      h1.textContent = 'Responder ao Pedido';
      sub.textContent = acao === 'aprovar'
        ? 'Ao aprovar, os dias de ausência são lançados automaticamente na folha'
        : 'Escreva a mensagem e envie a resposta';

      atualizarDetalhesVisiveis();
      if (verif) verif.style.display = 'none';
      if (endArea) endArea.style.display = 'none';
      if (formArea) formArea.style.display = 'block';
    }

    function mostrarEcraJaRespondido(estadoTexto, mensagemDetalhe) {
      var badge = document.getElementById('badgeAcao');
      var h1 = document.getElementById('tituloPagina');
      var sub = document.getElementById('subtituloPagina');
      var verif = document.getElementById('areaVerificacao');
      var formArea = document.getElementById('areaFormulario');
      var endArea = document.getElementById('areaEncerrado');
      var ico = document.getElementById('icoEncerrado');
      var tit = document.getElementById('tituloEncerrado');
      var desc = document.getElementById('descEncerrado');
      var res = document.getElementById('resumoEncerrado');

      if (verif) verif.style.display = 'none';
      if (formArea) formArea.style.display = 'none';
      if (endArea) endArea.style.display = 'block';

      var estLimpo = (estadoTexto || '').trim();
      var estUp = estLimpo.toUpperCase();
      var isRecusado = estUp.indexOf('RECUS') !== -1;

      badge.className = 'tag ' + (isRecusado ? 'recusar' : 'aprovar');
      badge.textContent = estLimpo ? (isRecusado ? '❌ ' + estLimpo : '✅ ' + estLimpo) : 'Pedido Respondido';
      h1.textContent = 'Pedido já respondido';
      sub.textContent = 'Registo encerrado · Balcão Agrícola';

      ico.textContent = isRecusado ? '❌' : '✅';
      tit.textContent = 'Este pedido já foi respondido';
      desc.textContent = mensagemDetalhe || ('O pedido encontra-se atualmente registado como ' + (estLimpo || 'respondido') + ' e não é permitida nova resposta.');

      res.innerHTML =
        '<div class="detalhes-row"><span class="detalhes-lbl">Colaborador:</span> <span class="detalhes-val">' + escaparHtml(infoPedido.nome) + '</span></div>' +
        '<div class="detalhes-row"><span class="detalhes-lbl">Motivo:</span> <span class="detalhes-val">' + escaparHtml(infoPedido.tipo) + '</span></div>' +
        '<div class="detalhes-row"><span class="detalhes-lbl">Período:</span> <span class="detalhes-val">' + escaparHtml(infoPedido.periodo) + '</span></div>' +
        (estLimpo ? ('<div class="detalhes-row"><span class="detalhes-lbl">Estado atual:</span> <span class="detalhes-val">' + escaparHtml(estLimpo) + '</span></div>') : '');
    }

    function escaparHtml(v) {
      return String(v || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function verificarEstadoPedidoServidor() {
      if (!pedidoId || !pedidoSig) {
        document.getElementById('tituloPagina').textContent = 'Link sem autorização';
        document.getElementById('subtituloPagina').textContent = 'Acesso protegido por token único';
        mostrarVerificacao('Este link está incompleto ou desatualizado. Abra o pedido através do email/Telegram mais recente ou pelo Painel de Gestão.', false);
        return;
      }

      var estadoLocal = lerEstadoLocal(pedidoId);
      if (estadoLocal && estadoLocal.toUpperCase().indexOf('AGUARDAR') === -1) {
        mostrarEcraJaRespondido(estadoLocal, 'Este pedido já foi respondido anteriormente e já não é possível submeter nova resposta.');
        return;
      }

      mostrarVerificacao('A confirmar se o pedido já foi respondido...', false);

      chamarJsonp({
        action: 'obterDetalhePedido',
        id: pedidoId,
        sig: pedidoSig,
        nome: infoPedido.nome,
        tipo: infoPedido.tipo,
        ini: qs.get('ini') || '',
        fim: qs.get('fim') || ''
      }, function(r) {
        if (r && r.ok && r.pedido) {
          infoPedido.nome = r.pedido.nome || infoPedido.nome;
          infoPedido.tipo = r.pedido.tipo || infoPedido.tipo;
          infoPedido.periodo = ((r.pedido.dataIni || r.pedido.dataFim) ? ((r.pedido.dataIni || '—') + ' → ' + (r.pedido.dataFim || '—')) : infoPedido.periodo);
          infoPedido.obs = r.pedido.obs || '';
          infoPedido.anexoNome = r.pedido.anexoNome || '';
          infoPedido.anexoUrl = r.pedido.anexoUrl || '';
          atualizarDetalhesVisiveis();

          var estAtual = String(r.pedido.estado || '').trim();
          if (!estAtual || estAtual.toUpperCase().indexOf('AGUARDAR') === -1) {
            var estGuardado = estAtual || 'Respondido';
            guardarEstadoLocal(pedidoId, estGuardado);
            mostrarEcraJaRespondido(estGuardado, 'Este pedido já foi respondido anteriormente e já não é possível submeter nova resposta.');
            return;
          }
          mostrarAreaFormulario();
          return;
        }

        var msgErr = (r && r.erro) ? r.erro : 'Não foi possível confirmar o estado do pedido neste momento. Verifique a ligação e tente novamente.';
        mostrarVerificacao(msgErr, true);
      });
    }

    (function init() {
      limparCacheLocalAoAbrir();
      atualizarDetalhesVisiveis();
      verificarEstadoPedidoServidor();
    })();

    function chamarJsonp(params, cb) {
      var cbName = 'cb_gh_' + Math.random().toString(36).substring(2, 10);
      var s = document.createElement('script');
      var timer = setTimeout(function() {
        delete window[cbName];
        if (s.parentNode) s.remove();
        if (cb) cb({ ok: false, erro: 'Sem resposta do servidor.' });
      }, 30000);
      window[cbName] = function(data) {
        clearTimeout(timer);
        delete window[cbName];
        if (s.parentNode) s.remove();
        if (cb) cb(data);
      };
      var url = APP_SCRIPT_URL + '?';
      for (var k in params) {
        if (Object.prototype.hasOwnProperty.call(params, k)) {
          url += encodeURIComponent(k) + '=' + encodeURIComponent(params[k]) + '&';
        }
      }
      url += '_nocache=' + encodeURIComponent(Date.now() + '_' + Math.random().toString(36).substring(2, 7)) + '&';
      url += 'callback=' + cbName;
      s.src = url;
      s.onerror = function() {
        clearTimeout(timer);
        delete window[cbName];
        if (s.parentNode) s.remove();
        if (cb) cb({ ok: false, erro: 'Erro de ligação ao servidor.' });
      };
      document.body.appendChild(s);
    }

    function enviarRespostaPedido() {
      if (!pedidoId || !pedidoSig) {
        mostrarEstado('err', 'Pedido ou token de autorização em falta no link.');
        return;
      }
      var btn = document.getElementById('btnEnviar');
      var comentario = (document.getElementById('mensagemResposta').value || '').trim();
      btn.disabled = true;
      mostrarEstado('wait', 'A enviar resposta...');

      chamarJsonp({
        action: 'responderPedido',
        id: pedidoId,
        sig: pedidoSig,
        decisao: acao,
        comentario: comentario
      }, function(r) {
        if (r && r.ok) {
          var estFinal = r.estado || (acao === 'aprovar' ? 'Aprovado' : 'Recusado');
          guardarEstadoLocal(pedidoId, estFinal);
          var descOk = 'A sua resposta foi registada com sucesso. Este pedido encontra-se agora encerrado.';
          if (acao === 'aprovar' && r.diasLancados > 0) {
            descOk += ' Foram lançados automaticamente ' + r.diasLancados + ' dia(s) na folha do colaborador.';
          }
          if (r.diasComPicagem && r.diasComPicagem.length > 0) {
            descOk += ' Aviso: dias com picagens já registadas foram preservados (' + r.diasComPicagem.join(', ') + ').';
          }
          mostrarEcraJaRespondido(estFinal, descOk);
        } else {
          if (r && r.jaRespondido) {
            var estJa = r.estadoAtual || (acao === 'aprovar' ? 'Aprovado' : 'Recusado');
            guardarEstadoLocal(pedidoId, estJa);
            mostrarEcraJaRespondido(estJa, r.erro || 'Este pedido já foi respondido anteriormente e já não permite nova resposta.');
          } else {
            btn.disabled = false;
            mostrarEstado('err', '❌ ' + ((r && r.erro) || 'Não foi possível enviar a resposta.'));
          }
        }
      });
    }

    function mostrarEstado(tipo, texto) {
      var el = document.getElementById('estadoEnvio');
      el.className = 'status-msg ' + tipo;
      el.textContent = texto;
    }
  </script>
</body>
</html>
