<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Registo de Ponto Oficial</title>

  <!-- MANIFESTO PWA INTEGRADO (DATA-URI) PARA BURLAR AS RESTRIÇÕES DO HYPEROS -->
  <link rel="manifest" href='data:application/manifest+json,{"name":"Registo de Ponto","short_name":"Ponto","start_url":"./index.html","display":"standalone","background_color":"#1f4e78","theme_color":"#1f4e78","icons":[{"src":"https://lh3.googleusercontent.com/d/1dgTBVH4Mv0nn4xwTRFC-5iRV5TJ2RQqG","sizes":"192x192","type":"image/png"}]}'>
  <meta name="theme-color" content="#1f4e78">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background-color: #1f4e78; }
    iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>

  <iframe 
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycbz4WzA4r4aOjJIWTco4z5QRQ7uzwhhnFDokLDLy77fI86BL5PEDR19O2YKlTA2d5lLKJQ/exec" 
    allow="geolocation; camera; microphone; display-capture"
    sandbox="allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts">
  </iframe>

  <script>
    // Registar Service Worker mínimo em memória para validar o PWA perante o Chrome no HyperOS
    if ('serviceWorker' in navigator) {
      const swCode = `
        self.addEventListener('install', e => self.skipWaiting());
        self.addEventListener('fetch', e => e.respondWith(fetch(e.request)));
      `;
      const blob = new Blob([swCode], { type: 'application/javascript' });
      const blobURL = URL.createObjectURL(blob);
      navigator.serviceWorker.register(blobURL).catch(() => {});
    }
  </script>
</body>
</html>
