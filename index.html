<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1c1917">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Ponto · Balcão Agrícola</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fdfbf7; --surface:#ffffff; --surface-2:#faf7f2;
  --text:#1c1917; --muted:#78716c; --light:#a8a29e;
  --border:#e7e5e4; --border-strong:#d6d3d1;
  --accent:#d97706; --accent-light:#f59e0b; --accent-dark:#b45309;
  --success:#16a34a; --danger:#dc2626; --warning:#ca8a04;
  --r-sm:12px; --r-md:16px; --r-lg:24px; --r-xl:32px;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;-webkit-tap-highlight-color:transparent;}
html{background:var(--bg);overflow-x:hidden;}
body{min-height:100dvh;color:var(--text);background:var(--bg);display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}

/* ===================== MAIN SCREEN ===================== */
#screenMain{display:flex;flex-direction:column;min-height:100dvh;}
.head{padding:28px 24px 16px;text-align:center;}
.brand{font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:14px;}
.clock{font-size:3.4rem;font-weight:300;letter-spacing:-.03em;line-height:1;color:var(--text);font-variant-numeric:tabular-nums;}
.clock-sub{margin-top:10px;font-size:.82rem;color:var(--muted);font-weight:500;display:flex;align-items:center;justify-content:center;gap:6px;}
.dot-live{width:7px;height:7px;border-radius:50%;background:var(--success);animation:pulse 2s infinite;}
.dot-live.off{background:var(--danger);animation:none;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

.main{flex:1;padding:16px 24px;display:flex;flex-direction:column;min-height:0;}
.prompt{text-align:center;font-size:.85rem;color:var(--muted);font-weight:600;margin-bottom:14px;letter-spacing:.01em;}
.pin-dots{display:flex;justify-content:center;gap:18px;margin-bottom:22px;}
.pin-dot{width:14px;height:14px;border-radius:50%;background:transparent;border:2px solid var(--border-strong);transition:all .25s cubic-bezier(.34,1.56,.64,1);}
.pin-dot.on{background:var(--text);border-color:var(--text);transform:scale(1.2);}

.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;flex:1;max-width:380px;width:100%;margin:0 auto;min-height:0;align-content:stretch;}
.key{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r-md);font-size:1.7rem;font-weight:600;color:var(--text);display:flex;align-items:center;justify-content:center;transition:all .12s ease;box-shadow:0 1px 0 var(--border);min-height:58px;font-variant-numeric:tabular-nums;}
.key:active{transform:translateY(2px) scale(.97);box-shadow:none;background:var(--surface-2);}
.key.zero{background:var(--text);color:#fff;border-color:var(--text);}
.key.zero:active{background:#000;}
.key.action{font-size:.9rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);}
.key.clear{color:var(--danger);}

.foot{padding:16px 24px calc(16px + env(safe-area-inset-bottom));display:flex;justify-content:center;}
.admin-link{font-size:.72rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--light);background:transparent;border:1.5px solid var(--border);border-radius:999px;padding:8px 18px;transition:all .2s;}
.admin-link:hover{color:var(--muted);border-color:var(--border-strong);}

/* ===================== OVERLAY ===================== */
.overlay{position:fixed;inset:0;background:rgba(28,25,23,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:100;display:none;align-items:center;justify-content:center;padding:24px;animation:fadeIn .2s;}
.overlay.show{display:flex;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);border-radius:var(--r-xl);padding:36px 28px 26px;max-width:400px;width:100%;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.35);animation:pop .35s cubic-bezier(.34,1.56,.64,1);}
@keyframes pop{from{opacity:0;transform:scale(.92) translateY(24px)}to{opacity:1;transform:scale(1) translateY(0)}}
.modal-icon{width:72px;height:72px;border-radius:50%;margin:0 auto 20px;display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--accent-light),var(--accent-dark));box-shadow:0 12px 24px rgba(217,119,6,.35);}
.modal-icon.success{background:linear-gradient(135deg,#22c55e,#16a34a);box-shadow:0 12px 24px rgba(22,163,74,.35);}
.modal-icon.error{background:linear-gradient(135deg,#f87171,#dc2626);box-shadow:0 12px 24px rgba(220,38,38,.35);}
.modal-icon.loading{background:linear-gradient(135deg,var(--muted),var(--text));}
.modal-icon.loading::after{content:'';width:26px;height:26px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.modal-name{font-size:1.35rem;font-weight:700;margin-bottom:4px;}
.modal-type{font-size:.75rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:16px;}
.modal-type.entrada{color:var(--success);}
.modal-type.saida{color:var(--danger);}
.modal-time{font-size:3.2rem;font-weight:200;letter-spacing:-.03em;line-height:1;margin-bottom:20px;font-variant-numeric:tabular-nums;}
.modal-totals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:16px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin-bottom:22px;}
.t-label{font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:4px;}
.t-value{font-size:1rem;font-weight:700;font-variant-numeric:tabular-nums;}
.modal-btn{width:100%;background:var(--text);color:#fff;padding:16px;border-radius:14px;font-size:.88rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;transition:all .15s;}
.modal-btn:active{transform:scale(.97);}
.modal-btn.secondary{background:transparent;color:var(--muted);border:1.5px solid var(--border);margin-top:8px;}
.modal-body{font-size:.92rem;color:var(--muted);line-height:1.55;margin-bottom:20px;}

/* ===================== ADMIN ===================== */
#screenAdmin{display:none;flex-direction:column;min-height:100dvh;background:var(--bg);}
.admin-head{padding:20px 20px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);background:var(--surface);}
.admin-title{font-size:1.05rem;font-weight:800;letter-spacing:-.01em;}
.back-btn{padding:8px 14px;background:var(--surface-2);border:1.5px solid var(--border);border-radius:999px;font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);}
.admin-body{flex:1;overflow-y:auto;padding:20px;max-width:600px;width:100%;margin:0 auto;}
.card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r-lg);padding:22px;margin-bottom:16px;}
.card h3{font-size:.78rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:16px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
.field input,.field select{width:100%;padding:13px 15px;border:1.5px solid var(--border);border-radius:var(--r-sm);font-size:16px;font-weight:600;color:var(--text);background:var(--surface-2);outline:none;transition:all .18s;font-family:inherit;}
.field input:focus,.field select:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 4px rgba(217,119,6,.12);}
.btn-primary{width:100%;padding:15px;background:var(--text);color:#fff;border-radius:var(--r-sm);font-size:.85rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;transition:all .15s;}
.btn-primary:active{transform:scale(.98);}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;}
.btn-secondary{width:100%;padding:14px;background:var(--surface-2);color:var(--text);border:1.5px solid var(--border);border-radius:var(--r-sm);font-size:.82rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-top:10px;}
.punch-row{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:var(--surface-2);border-radius:var(--r-sm);margin-bottom:8px;font-size:.9rem;}
.punch-row strong{font-weight:700;}
.punch-row .badge{font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:999px;}
.badge.in{background:#dcfce7;color:#166534;}
.badge.out{background:#fee2e2;color:#991b1b;}
.empty{text-align:center;color:var(--muted);font-size:.85rem;padding:20px;}
.tab-bar{display:flex;gap:6px;padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto;-webkit-overflow-scrolling:touch;}
.tab-btn{padding:9px 16px;border-radius:999px;background:transparent;font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap;border:1.5px solid transparent;}
.tab-btn.active{background:var(--text);color:#fff;}
.tab-panel{display:none;}
.tab-panel.active{display:block;}
.punch-list{max-height:340px;overflow-y:auto;padding-right:4px;}
</style>
</head>
<body>

<!-- MAIN -->
<div id="screenMain">
  <div class="head">
    <div class="brand">Balcão Agrícola · Registo de Ponto</div>
    <div class="clock" id="clock">--:--:--</div>
    <div class="clock-sub"><span class="dot-live" id="liveDot"></span><span id="clockSub">A sincronizar…</span></div>
  </div>
  <div class="main">
    <div class="prompt" id="promptText">Introduza o seu PIN</div>
    <div class="pin-dots" id="pinDots">
      <div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div>
    </div>
    <div class="numpad" id="numpad">
      <button class="key" data-key="1">1</button>
      <button class="key" data-key="2">2</button>
      <button class="key" data-key="3">3</button>
      <button class="key" data-key="4">4</button>
      <button class="key" data-key="5">5</button>
      <button class="key" data-key="6">6</button>
      <button class="key" data-key="7">7</button>
      <button class="key" data-key="8">8</button>
      <button class="key" data-key="9">9</button>
      <button class="key action clear" data-key="C">Limpar</button>
      <button class="key zero" data-key="0">0</button>
      <button class="key action" data-key="B">⌫</button>
    </div>
  </div>
  <div class="foot">
    <button class="admin-link" onclick="openAdminGate()">⚙ Admin</button>
  </div>
</div>

<!-- ADMIN -->
<div id="screenAdmin">
  <div class="admin-head">
    <div class="admin-title">Painel de Gestão</div>
    <button class="back-btn" onclick="closeAdmin()">Sair</button>
  </div>
  <div class="tab-bar">
    <button class="tab-btn active" data-tab="hoje">Hoje</button>
    <button class="tab-btn" data-tab="corrigir">Corrigir</button>
    <button class="tab-btn" data-tab="pdf">PDF</button>
    <button class="tab-btn" data-tab="colabs">Colaboradores</button>
  </div>
  <div class="admin-body">
    <!-- HOJE -->
    <div class="tab-panel active" id="panelHoje">
      <div class="card">
        <h3>🕒 Picagens de hoje</h3>
        <div id="todayList" class="punch-list"><div class="empty">A carregar…</div></div>
        <button class="btn-secondary" onclick="loadToday()">🔄 Atualizar</button>
      </div>
    </div>

    <!-- CORRIGIR -->
    <div class="tab-panel" id="panelCorrigir">
      <div class="card">
        <h3>✏️ Adicionar picagem</h3>
        <div class="field"><label>Colaborador</label><select id="corrNome"></select></div>
        <div class="field"><label>Data</label><input type="date" id="corrData"></div>
        <div class="field"><label>Hora</label><input type="time" id="corrHora"></div>
        <button class="btn-primary" onclick="submitCorrecao()">Adicionar Picagem</button>
      </div>
      <div class="card">
        <h3>🗑️ Remover picagem</h3>
        <div class="field"><label>Colaborador</label><select id="remNome"></select></div>
        <div class="field"><label>Data</label><input type="date" id="remData"></div>
        <button class="btn-secondary" style="background:#fee2e2;color:#991b1b;border-color:#fecaca;" onclick="loadPicagensDia()">Ver picagens desse dia</button>
        <div id="remList" class="punch-list" style="margin-top:14px;"></div>
      </div>
    </div>

    <!-- PDF -->
    <div class="tab-panel" id="panelPdf">
      <div class="card">
        <h3>📄 Exportar PDF</h3>
        <div class="field"><label>Colaborador</label><select id="pdfNome"><option value="TODOS">TODOS</option></select></div>
        <div class="field"><label>Data início</label><input type="date" id="pdfIni"></div>
        <div class="field"><label>Data fim</label><input type="date" id="pdfFim"></div>
        <button class="btn-primary" onclick="submitPdf()">Gerar e Enviar PDF</button>
      </div>
    </div>

    <!-- COLABORADORES -->
    <div class="tab-panel" id="panelColabs">
      <div class="card">
        <h3>➕ Adicionar colaborador</h3>
        <div class="field"><label>Nome</label><input type="text" id="newNome" placeholder="Nome completo"></div>
        <div class="field"><label>PIN (4 dígitos)</label><input type="text" id="newPin" maxlength="4" inputmode="numeric" placeholder="0000"></div>
        <div class="field"><label>Filial</label><select id="newFilial"><option value="Pataias">Pataias</option><option value="Garcia">Garcia</option></select></div>
        <button class="btn-primary" onclick="submitNovoFuncionario()">Registar</button>
      </div>
      <div class="card">
        <h3>❌ Inativar colaborador</h3>
        <div class="field"><label>Colaborador</label><select id="inativarNome"></select></div>
        <button class="btn-secondary" style="background:#fee2e2;color:#991b1b;border-color:#fecaca;" onclick="submitInativar()">Inativar</button>
      </div>
    </div>
  </div>
</div>

<!-- OVERLAY -->
<div class="overlay" id="overlay">
  <div class="modal" id="modal"></div>
</div>

<script>
/* ============ CONFIG ============ */
const APP_URL = "COLA_AQUI_O_TEU_NOVO_DEPLOY_URL"; // ex: https://script.google.com/macros/s/AKfy.../exec
const MIN_WAIT_LOCAL = 30; // segundos entre picagens (feedback imediato)
const LS_PIN_HASH = "PONTO_PIN_HASH_V1";
const LS_QUEUE = "PONTO_QUEUE_V1";
const LS_LAST = "PONTO_LAST_PUNCH_MS";

/* ============ STATE ============ */
let pinBuffer = "";
let adminSenha = "";
let processing = false;
let funcionariosCache = [];

/* ============ CLOCK ============ */
function tickClock() {
  const now = new Date();
  const hh = String(now.getHours()).padStart(2,'0');
  const mm = String(now.getMinutes()).padStart(2,'0');
  const ss = String(now.getSeconds()).padStart(2,'0');
  document.getElementById('clock').textContent = `${hh}:${mm}:${ss}`;
  const dias = ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
  const meses = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  document.getElementById('clockSub').textContent = `${dias[now.getDay()]}, ${now.getDate()} ${meses[now.getMonth()]} ${now.getFullYear()}`;
}
setInterval(tickClock, 1000); tickClock();

/* ============ ONLINE STATE ============ */
function updateOnlineState() {
  const dot = document.getElementById('liveDot');
  const label = document.getElementById('clockSub');
  if (!navigator.onLine) {
    dot.classList.add('off');
    label.textContent += ' · offline';
  } else {
    dot.classList.remove('off');
  }
}
window.addEventListener('online', () => { updateOnlineState(); syncQueue(); });
window.addEventListener('offline', updateOnlineState);
updateOnlineState();

/* ============ NUMPAD ============ */
function updateDots() {
  const dots = document.querySelectorAll('#pinDots .pin-dot');
  dots.forEach((d, i) => d.classList.toggle('on', i < pinBuffer.length));
}
function vibrate() {
  if ('vibrate' in navigator) navigator.vibrate(15);
}
function handleKey(k) {
  if (processing) return;
  if (k >= '0' && k <= '9') {
    if (pinBuffer.length >= 4) return;
    pinBuffer += k;
    vibrate();
    updateDots();
    if (pinBuffer.length === 4) setTimeout(submitPin, 200);
  } else if (k === 'B') {
    pinBuffer = pinBuffer.slice(0, -1);
    updateDots();
  } else if (k === 'C') {
    pinBuffer = '';
    updateDots();
  }
}
document.getElementById('numpad').addEventListener('click', (e) => {
  const btn = e.target.closest('.key');
  if (!btn) return;
  handleKey(btn.dataset.key);
});

/* ============ OVERLAY ============ */
function showModal(html) {
  document.getElementById('modal').innerHTML = html;
  document.getElementById('overlay').classList.add('show');
}
function hideModal() {
  document.getElementById('overlay').classList.remove('show');
}
function showLoading(title, sub) {
  showModal(`
    <div class="modal-icon loading"></div>
    <div class="modal-name">${title}</div>
    <div class="modal-body">${sub || 'Aguarde…'}</div>
  `);
}
function showError(title, msg) {
  showModal(`
    <div class="modal-icon error">!</div>
    <div class="modal-name">${title}</div>
    <div class="modal-body">${msg}</div>
    <button class="modal-btn" onclick="hideModal()">Fechar</button>
  `);
}
function showSuccess(r) {
  const tipoCls = r.tipo === 'Entrada' ? 'entrada' : 'saida';
  showModal(`
    <div class="modal-icon success">✓</div>
    <div class="modal-name">${r.nome}</div>
    <div class="modal-type ${tipoCls}">${r.tipo}</div>
    <div class="modal-time">${r.hora}</div>
    <div class="modal-totals">
      <div><div class="t-label">Hoje</div><div class="t-value">${r.horasHoje}</div></div>
      <div><div class="t-label">Semana</div><div class="t-value">${r.horasSemana}</div></div>
      <div><div class="t-label">Mês</div><div class="t-value">${r.horasMes}</div></div>
    </div>
    <button class="modal-btn" onclick="hideModal()">Fechar</button>
  `);
}

/* ============ PIN HASH (offline) ============ */
async function hashPin(pin) {
  const buf = new TextEncoder().encode(String(pin).trim());
  const hash = await crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2,'0')).join('');
}
function getHashes() {
  try { return JSON.parse(localStorage.getItem(LS_PIN_HASH) || '{}'); } catch(e) { return {}; }
}
function setHashes(obj) { localStorage.setItem(LS_PIN_HASH, JSON.stringify(obj)); }

/* ============ QUEUE OFFLINE ============ */
function getQueue() {
  try { return JSON.parse(localStorage.getItem(LS_QUEUE) || '[]'); } catch(e) { return []; }
}
function setQueue(q) { localStorage.setItem(LS_QUEUE, JSON.stringify(q)); }

async function submitPin() {
  if (processing) return;
  processing = true;

  const pin = pinBuffer;
  pinBuffer = '';
  updateDots();

  // Prefer: try to identify via cached hash first (fast + offline)
  const hashes = getHashes();
  const h = await hashPin(pin);
  const nomeFromCache = hashes[h];

  if (!navigator.onLine) {
    // OFFLINE PATH
    if (!nomeFromCache) {
      showError('Sem rede', 'Primeira vez neste telemóvel. Ligue-se à internet pelo menos uma vez para memorizar este PIN.');
      processing = false;
      return;
    }
    const item = {
      idUnico: 'OFF_' + Date.now() + '_' + Math.random().toString(36).slice(2,6),
      nome: nomeFromCache,
      pin: pin,
      lat: 0, lon: 0,
      isMock: false,
      disp: navigator.userAgent,
      horaLocal: new Date().toISOString()
    };
    const q = getQueue(); q.push(item); setQueue(q);
    showModal(`
      <div class="modal-icon success">✓</div>
      <div class="modal-name">${nomeFromCache}</div>
      <div class="modal-type">Guardado offline</div>
      <div class="modal-body">Picagem guardada às ${new Date().toLocaleTimeString('pt-PT')}. Será enviada quando houver rede.</div>
      <button class="modal-btn" onclick="hideModal()">Fechar</button>
    `);
    processing = false;
    return;
  }

  // ONLINE PATH
  showLoading('A registar', 'A validar o PIN no servidor…');

  jsonp({
    action: 'salvarPontoPorPin',
    pin: pin,
    lat: 0, lon: 0,
    isMock: 'false',
    disp: navigator.userAgent
  }, async (resp) => {
    if (!resp || !resp.ok) {
      const msg = (resp && resp.erro) || 'Erro desconhecido';
      showError('Não registado', msg);
      processing = false;
      return;
    }
    // Cache hash for future offline
    hashes[h] = resp.nome;
    setHashes(hashes);
    showSuccess(resp);
    processing = false;
  });
}

/* ============ JSONP HELPER ============ */
function jsonp(params, cb) {
  const cbName = 'jsonp_' + Math.random().toString(36).slice(2,10);
  const script = document.createElement('script');
  let url = APP_URL + '?';
  for (const k in params) url += encodeURIComponent(k) + '=' + encodeURIComponent(params[k]) + '&';
  url += 'callback=' + cbName;

  const timeout = setTimeout(() => {
    delete window[cbName];
    if (script.parentNode) script.remove();
    cb({ ok:false, erro:'Timeout na comunicação com o servidor' });
  }, 30000);

  window[cbName] = (data) => {
    clearTimeout(timeout);
    delete window[cbName];
    if (script.parentNode) script.remove();
    cb(data);
  };
  script.onerror = () => {
    clearTimeout(timeout);
    delete window[cbName];
    if (script.parentNode) script.remove();
    cb({ ok:false, erro:'Erro de rede' });
  };
  script.src = url;
  document.body.appendChild(script);
}

/* ============ SYNC QUEUE ============ */
async function syncQueue() {
  const q = getQueue();
  if (q.length === 0) return;
  const hashes = getHashes();
  const remaining = [];

  for (const item of q) {
    await new Promise((resolve) => {
      jsonp({
        action: 'salvarPonto',
        nome: item.nome,
        pin: item.pin,
        lat: item.lat || 0,
        lon: item.lon || 0,
        isMock: 'false',
        disp: item.disp || '',
        idUnico: item.idUnico,
        horaOffline: item.horaLocal
      }, (resp) => {
        if (!resp || !resp.ok) {
          // Permanent failure? drop if server says "PIN incorreto" or "não encontrado"
          const err = (resp && resp.erro) || '';
          if (/incorreto|não encontrado|inativo/i.test(err)) {
            // Drop
          } else {
            remaining.push(item);
          }
        }
        resolve();
      });
    });
  }
  setQueue(remaining);
}

/* ============ ADMIN ============ */
function openAdminGate() {
  showModal(`
    <div class="modal-name" style="margin-bottom:14px;">Área Reservada</div>
    <div class="modal-body">Introduza a palavra-passe de administração.</div>
    <div class="field" style="margin-bottom:16px;">
      <input type="password" id="adminPin" placeholder="••••" style="text-align:center;font-size:1.4rem;letter-spacing:6px;">
    </div>
    <button class="modal-btn" onclick="submitAdminGate()">Entrar</button>
    <button class="modal-btn secondary" onclick="hideModal()">Cancelar</button>
  `);
  setTimeout(() => document.getElementById('adminPin').focus(), 100);
}

function submitAdminGate() {
  const pin = document.getElementById('adminPin').value;
  if (!pin) return;
  showLoading('A validar', '');
  jsonp({ action: 'verificarSenha', senha: pin }, (resp) => {
    if (resp && resp.ok) {
      adminSenha = pin;
      hideModal();
      document.getElementById('screenMain').style.display = 'none';
      document.getElementById('screenAdmin').style.display = 'flex';
      loadColabsAdmin();
      loadToday();
      setDefaultDates();
    } else {
      showError('Acesso negado', 'Palavra-passe incorreta');
    }
  });
}

function closeAdmin() {
  adminSenha = '';
  document.getElementById('screenAdmin').style.display = 'none';
  document.getElementById('screenMain').style.display = 'flex';
}

/* TABS */
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel' + btn.dataset.tab.charAt(0).toUpperCase() + btn.dataset.tab.slice(1)).classList.add('active');
    if (btn.dataset.tab === 'hoje') loadToday();
    if (btn.dataset.tab === 'pdf') loadColabsAdmin();
    if (btn.dataset.tab === 'corrigir') loadColabsAdmin();
    if (btn.dataset.tab === 'colabs') loadColabsAdmin();
  });
});

function setDefaultDates() {
  const now = new Date();
  const ymd = now.toISOString().slice(0,10);
  const ymd1st = new Date(now.getFullYear(), now.getMonth(), 1).toISOString().slice(0,10);
  ['corrData','remData'].forEach(id => { const el = document.getElementById(id); if (el) el.value = ymd; });
  const pi = document.getElementById('pdfIni'); if (pi) pi.value = ymd1st;
  const pf = document.getElementById('pdfFim'); if (pf) pf.value = ymd;
}

function loadColabsAdmin() {
  jsonp({ action: 'obterFuncionarios' }, (resp) => {
    if (!resp || !resp.ok) return;
    const list = resp.funcionarios || [];
    funcionariosCache = list;
    ['corrNome','remNome','pdfNome'].forEach(id => {
      const sel = document.getElementById(id);
      if (!sel) return;
      const isPdf = id === 'pdfNome';
      sel.innerHTML = isPdf ? '<option value="TODOS">TODOS</option>' : '<option value="">Selecione…</option>';
      list.forEach(n => {
        const o = document.createElement('option'); o.value = n; o.text = n;
        sel.appendChild(o);
      });
    });
    const selInat = document.getElementById('inativarNome');
    if (selInat) {
      selInat.innerHTML = '<option value="">Selecione…</option>';
      list.forEach(n => { const o = document.createElement('option'); o.value = n; o.text = n; selInat.appendChild(o); });
    }
  });
}

function loadToday() {
  const box = document.getElementById('todayList');
  box.innerHTML = '<div class="empty">A carregar…</div>';
  jsonp({ action: 'obterResumoHoje', senha: adminSenha }, (resp) => {
    if (!resp || !resp.ok) { box.innerHTML = `<div class="empty">${(resp && resp.erro) || 'Erro'}</div>`; return; }
    const emp = resp.employees || [];
    if (emp.length === 0) { box.innerHTML = '<div class="empty">Sem picagens hoje.</div>'; return; }
    box.innerHTML = emp.map(e => `
      <div class="punch-row">
        <div>
          <strong>${e.nome}</strong><br>
          <span style="color:var(--muted);font-size:.8rem;">${e.picagens}</span>
        </div>
        <span class="badge ${e.aberto ? 'in' : 'out'}">${e.aberto ? 'Dentro' : 'Fora'}</span>
      </div>
    `).join('');
  });
}

function submitCorrecao() {
  const nome = document.getElementById('corrNome').value;
  const data = document.getElementById('corrData').value;
  const hora = document.getElementById('corrHora').value;
  if (!nome || !data || !hora) { showError('Campos em falta','Preencha tudo.'); return; }
  showLoading('A guardar','');
  jsonp({ action:'corrigirPicagem', nome, data, hora, senha: adminSenha }, (resp) => {
    if (resp && resp.ok) { showSuccess({ nome, tipo:'Adicionada', hora, horasHoje:resp.horasHoje||'—', horasSemana:resp.horasSemana||'—', horasMes:resp.horasMes||'—' }); }
    else showError('Erro', (resp && resp.erro) || 'Erro');
  });
}

function loadPicagensDia() {
  const nome = document.getElementById('remNome').value;
  const data = document.getElementById('remData').value;
  if (!nome || !data) { showError('Campos em falta','Escolha colaborador e data.'); return; }
  const box = document.getElementById('remList');
  box.innerHTML = '<div class="empty">A carregar…</div>';
  jsonp({ action:'listarPicagens', nome, data, senha: adminSenha }, (resp) => {
    if (!resp || !resp.ok) { box.innerHTML = `<div class="empty">${(resp && resp.erro) || 'Erro'}</div>`; return; }
    const ps = resp.picagens || [];
    if (ps.length === 0) { box.innerHTML = '<div class="empty">Sem picagens neste dia.</div>'; return; }
    box.innerHTML = ps.map((p, idx) => `
      <div class="punch-row">
        <strong>${p.hora}</strong>
        <span style="color:var(--muted);font-size:.8rem;flex:1;margin-left:10px;">${p.tipo}</span>
        <button class="back-btn" style="background:#fee2e2;color:#991b1b;border-color:#fecaca;" onclick="removerPicagem(${idx})">🗑️</button>
      </div>
    `).join('');
  });
}

function removerPicagem(idx) {
  const nome = document.getElementById('remNome').value;
  const data = document.getElementById('remData').value;
  jsonp({ action:'corrigirPicagem', nome, data, index: idx, modo:'remover', senha: adminSenha }, (resp) => {
    if (resp && resp.ok) { loadPicagensDia(); loadToday(); }
    else showError('Erro', (resp && resp.erro) || 'Erro');
  });
}

function submitPdf() {
  const nome = document.getElementById('pdfNome').value;
  const ini = document.getElementById('pdfIni').value;
  const fim = document.getElementById('pdfFim').value;
  if (!nome || !ini || !fim) { showError('Campos em falta','Preencha tudo.'); return; }
  showLoading('A gerar PDF','Vai receber por email em alguns segundos…');
  jsonp({ action:'gerarPdf', nome, ini, fim, senha: adminSenha }, (resp) => {
    if (resp && resp.ok) {
      showModal(`
        <div class="modal-icon success">✓</div>
        <div class="modal-name">PDF pedido</div>
        <div class="modal-body">Vai receber o PDF no email configurado em alguns segundos.</div>
        <button class="modal-btn" onclick="hideModal()">Fechar</button>
      `);
    } else {
      showError('Erro', (resp && resp.erro) || 'Erro');
    }
  });
}

function submitNovoFuncionario() {
  const nome = document.getElementById('newNome').value.trim();
  const pin = document.getElementById('newPin').value.trim();
  const filial = document.getElementById('newFilial').value;
  if (!nome || !pin || pin.length !== 4) { showError('Dados inválidos','Nome e PIN de 4 dígitos são obrigatórios.'); return; }
  jsonp({ action:'adicionarFuncionario', nome, pin, filial, senha: adminSenha }, (resp) => {
    if (resp && resp.ok) { showSuccess({nome, tipo:'Adicionado', hora:'—', horasHoje:'—', horasSemana:'—', horasMes:'—'}); loadColabsAdmin(); document.getElementById('newNome').value=''; document.getElementById('newPin').value=''; }
    else showError('Erro', (resp && resp.erro) || 'Erro');
  });
}

function submitInativar() {
  const nome = document.getElementById('inativarNome').value;
  if (!nome) return;
  if (!confirm(`Inativar ${nome}?`)) return;
  jsonp({ action:'removerFuncionario', nome, senha: adminSenha }, (resp) => {
    if (resp && resp.ok) { showSuccess({nome, tipo:'Inativado', hora:'—', horasHoje:'—', horasSemana:'—', horasMes:'—'}); loadColabsAdmin(); }
    else showError('Erro', (resp && resp.erro) || 'Erro');
  });
}

/* ============ INIT ============ */
document.addEventListener('DOMContentLoaded', () => {
  setDefaultDates();
  if (navigator.onLine) setTimeout(syncQueue, 2000);
});
