<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Manutenção · Balcão Agrícola</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#facc15">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Plus Jakarta Sans',sans-serif}
body{min-height:100vh;background:radial-gradient(circle at 15% 15%, rgba(250,204,21,0.15) 0%, transparent 50%), radial-gradient(circle at 85% 80%, rgba(245,158,11,0.12) 0%, transparent 50%), linear-gradient(135deg,#fffbeb 0%,#fefce8 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;color:#0f172a}
.container{width:100%;max-width:480px;background:#ffffff;border-radius:32px;box-shadow:0 24px 48px rgba(15,23,42,.12), 0 8px 16px rgba(15,23,42,.06);overflow:hidden;border:1px solid #fde68a;position:relative}
.faixa{height:18px;background:repeating-linear-gradient(45deg,#facc15 0 20px,#0f172a 20px 40px);animation:faixaMove 1s linear infinite}
@keyframes faixaMove{0%{background-position:0 0}100%{background-position:40px 0}}
.header{padding:28px 24px 18px;text-align:center;background:linear-gradient(180deg,#ffffff 0%,#fffbeb 100%)}
.logo{width:100%;max-width:280px;max-height:90px;object-fit:contain;margin:0 auto 8px;display:block}
.badge{display:inline-flex;align-items:center;gap:6px;background:#fef3c7;color:#92400e;border:1px solid #fde68a;padding:6px 14px;border-radius:999px;font-size:.75rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.conteudo{padding:24px 22px 28px;text-align:center}
.icones{font-size:2.2rem;letter-spacing:6px;margin-bottom:12px;animation:flutuar 2.5s ease-in-out infinite}
@keyframes flutuar{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.titulo{font-size:1.55rem;font-weight:800;line-height:1.1;margin-bottom:12px;color:#0f172a}
.titulo span{display:block;font-size:1.1rem;margin-top:4px;color:#92400e}
.mensagem{background:#fffbeb;border:1.5px solid #fde68a;border-radius:18px;padding:16px 14px;font-size:.95rem;font-weight:600;line-height:1.5;color:#78350f;margin-bottom:16px}
.mensagem strong{color:#0f172a}
.obrigado{font-size:.9rem;font-weight:700;color:#64748b;margin-top:8px}
.relogio{margin-top:16px;background:#0f172a;color:#fde68a;font-family:monospace;font-weight:700;padding:10px 14px;border-radius:12px;display:inline-flex;gap:8px;letter-spacing:.04em}
.pulse{width:8px;height:8px;background:#facc15;border-radius:50%;box-shadow:0 0 10px #facc15;animation:pulse 1.5s infinite}
@keyframes pulse{0%{transform:scale(1);opacity:1}100%{transform:scale(2.2);opacity:0}}
.footer{padding:14px;text-align:center;font-size:.7rem;color:#a1a1aa;background:#fffbeb;border-top:1px solid #fef3c7}
</style>
</head>
<body>
<div class="container">
<div class="faixa"></div>
<div class="header">
<img src="https://balcaoagricola.pt/wp-content/uploads/2023/02/logo-balcao-agricola.png" alt="Balcão Agrícola" class="logo" onerror="this.style.display='none'">
<div class="badge">🚧 Sistema em Manutenção</div>
</div>
<div class="conteudo">
<div class="icones">👷‍♂️ 🔨 👷‍♀️ 🚜 👷</div>
<div class="titulo">Sistema em Manutenção<span>🚧</span></div>
<div class="mensagem">
Até informação em contrário,<br>
<strong>registe o ponto nos locais habituais.</strong>
</div>
<div class="obrigado">Obrigado pela sua compreensão.</div>
</div>
<div class="faixa"></div>
<div class="footer">Balcão Agrícola · Ponto · v2026.81 Manutenção</div>
</div>
</body>
</html>
