<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Registo de Ponto em Manutenção · Balcão Agrícola</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Plus Jakarta Sans',sans-serif}
body{min-height:100vh;background:#f8fafc;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:460px;background:#fff;border-radius:28px;box-shadow:0 24px 48px rgba(15,23,42,0.12);border:1px solid #e2e8f0;overflow:hidden}
.header{padding:36px 28px 18px;text-align:center}
.logo{font-size:2.6rem;margin-bottom:14px}
.header h1{font-size:1.35rem;font-weight:800;color:#0f172a;text-transform:uppercase;letter-spacing:0.02em}
.header p{margin-top:8px;color:#64748b;font-size:0.9rem;font-weight:600}
.body{padding:8px 28px 12px}
.instrucoes{background:#f8fafc;border:1.5px solid #e2e8f0;border-radius:18px;padding:22px}
.instrucoes p{font-size:1rem;font-weight:700;color:#0f172a;text-align:center;line-height:1.5}
.instrucoes strong{color:#059669}
.agradecimento{padding:18px 28px 10px;text-align:center}
.agradecimento p{font-size:0.95rem;font-weight:700;color:#334155}
.footer{padding:12px 28px 28px;text-align:center}
.footer small{color:#94a3b8;font-size:0.75rem;font-weight:600}
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <div class="logo">🚧</div>
    <h1>Sistema em Manutenção</h1>
    <p>Registo de Ponto · Balcão Agrícola</p>
  </div>
  <div class="body">
    <div class="instrucoes">
      <p>Registe o ponto em loja<br><strong>no livro</strong> ou <strong>com o dedo na máquina de ponto</strong></p>
    </div>
  </div>
  <div class="agradecimento">
    <p>Obrigado pela sua compreensão.</p>
  </div>
  <div class="footer">
    <small>Balcão Agrícola · Gaspar & Novo, Lda</small>
  </div>
</div>
</body>
</html>
